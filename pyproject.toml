[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-transfer-contract"
version = "0.2.0"
description = "Demo: one generic record-transfer operator on hook contracts (no per-pair operators)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "requests",
  "fsspec",
]

[project.optional-dependencies]
iceberg = ["pyiceberg[pyarrow,sql-sqlite]", "pyarrow"]
emulators = [
  "s3fs>=2024.1.0",
  "gcsfs>=2024.1.0",
  "adlfs>=2024.1.0",
  "boto3>=1.34",
  "google-cloud-storage>=2.14",
  "azure-storage-blob>=12.19",
]
adbc = [
  "pyarrow",
  "adbc-driver-manager",
  "adbc-driver-sqlite",
]
# Airflow 3.4 supports Python 3.11–3.14. Versions match the Airflow 3.4.0
# constraint set (constraints-3.4.0/constraints-3.12.txt). `just aip132-test`
# installs this extra with that constraint file.
aip132 = [
  "apache-airflow==3.4.0",
  "apache-airflow-providers-common-io==1.11.0",
  "apache-airflow-providers-amazon[s3fs]==9.39.0",
  "apache-airflow-providers-google==22.8.0",
  "apache-airflow-providers-microsoft-azure==15.3.0",
  "s3fs==2026.9.0",
  "gcsfs==2026.10.1",
  "adlfs==2026.8.0",
]
dev = ["pytest", "requests-mock"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "iceberg: needs pyiceberg optional extra",
  "integration: needs object-store emulators (just up)",
  "adbc: needs adbc-driver-sqlite optional extra",
  "local: sqlite or local files; does not need the object-store emulators",
  "aip132: needs the aip132 extra (Airflow 3 and common.io)",
]
